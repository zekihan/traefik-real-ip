name: Publish
'on':
  push:
    tags:
      - v*
permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  decide:
    uses: zekihan/release-workflows/.github/workflows/decide.yaml@fbe3254a678abe4c4c4ae5486a18869bdc6a734d # main
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      mode: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'edge' }}
  checks:
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    uses: ./.github/workflows/pr.yaml
    permissions:
      contents: read
    with:
      publishing: true
  release:
    needs:
      - decide
      - checks
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: zekihan/release-workflows/.github/workflows/release.yaml@fbe3254a678abe4c4c4ae5486a18869bdc6a734d # main
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ needs.decide.outputs.version }}
      binaries: false
